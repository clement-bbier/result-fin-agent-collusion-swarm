name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHONUTF8: "1"
  MPLBACKEND: Agg
  FINSWARM_PROVIDER_DEFAULT: mock

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync
        run: uv sync --frozen
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest -q -m "not slow and not llm"
      - name: Secret scan
        run: uv run python scripts/secret_scan.py
