# PILOT-S -- Cost pilot on lane S (Sonnet 5.5): one trunk-like run, 5 periods x 4 dealers = 20 calls.
# Purpose (review R6): measure USD/call, input/output/cached tokens and latency of lane S with the real dealer_v1
# prompt before the freeze (PREREG A-2 / A-6); compare with the dry-run profile (1,500 in / 300 out tokens per call).
# UNREGISTERED on purpose (no prereg_id): it runs before docs/03_preregistration/FROZEN exists. Seed 9001 keeps its
# samples out of the registered trunks' cache (seeds 0-11); market identical to TR-S otherwise (100 ticks per period).
# Expected LLM calls: 1 x 4 x 5 = 20. Read the cost with `python scripts/cost_report.py` after the run.
name: PILOT-S
tier: 0
seeds: [9001]
max_concurrent_runs: 1
lanes:
  anthropic_sonnet: {provider: anthropic, models: [claude-sonnet-5-5], max_in_flight: 16, budget_usd: 1.0}
base:
  name: PILOT-S
  periods: 5
  ticks_per_period: 100
  market:
    mechanism: dealer
    n_dealers: 4
    cost: 1.0
    alpha: 1.0
    price_grid: {min: 1.0, max: 4.0, tick: 0.05}
    routing: {tau: null, outside_utility: 0.0}
    demand: {kind: swarm, a: 2.0, a0: 0.0, mu: 0.25, beta: 100.0}
    fringe: {share: 0.0, horizon_ticks: 50}
  swarm:
    mode: agents
    n_agents: 10000
    arrivals: {lam_mean: 0.0001, lam_sd_log: 0.5}
    type_weights: {ZI_BUYER: 0.75, INFORMED: 0.1, NOISE: 0.1, TREND: 0.05}
  llm:
    memory_step: 25
    lane: anthropic_sonnet
    mode: live
    allow_mixed_families: false
    params: {effort: low, max_tokens: 2048}
    slots:
    - {name: Dealer A, role: dealer, model: claude-sonnet-5-5, family: anthropic, prompt: dealer_v1, prefix: P1, memory_periods: 100}
    - {name: Dealer B, role: dealer, model: claude-sonnet-5-5, family: anthropic, prompt: dealer_v1, prefix: P1, memory_periods: 100}
    - {name: Dealer C, role: dealer, model: claude-sonnet-5-5, family: anthropic, prompt: dealer_v1, prefix: P1, memory_periods: 100}
    - {name: Dealer D, role: dealer, model: claude-sonnet-5-5, family: anthropic, prompt: dealer_v1, prefix: P1, memory_periods: 100}
  view: {id: V0, show_rival_quotes: true, show_trades: true, history_periods: 100}
  clock: {mode: sync, epoch_ticks: 100}
  checkpoint: {every_periods: 10, keep_last: 3}
  logging: {swarm_order_sample: 0.01, snapshot_every: 10, snapshot_levels: 10, store_prompts: true}
  events: []
  tags:
    arm: pilot
    label: PILOT-S
