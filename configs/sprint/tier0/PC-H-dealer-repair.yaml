# PC-H-dealer-repair -- Gate 1b RE-RUN VARIANT: identical to PC-H-dealer except seeds 9101-9108 and tags.variant = repair.
# NOT LAUNCHED unless a registered template repair happens (REDTEAM_RESPONSE, Gate 1b failure path: one dealer_v1 repair until
# Saturday 20:00, recorded as an amendment in docs/03_preregistration/AMENDMENTS.md before this file is run). Fresh seeds so the
# repaired template is never scored on the seeds that failed; the run ids differ from PC-H-dealer's, so nothing is resumed or replayed.
# PREREG section 1 Gate 1b (D-12); docs/03_preregistration/campaign_table.md.
# Expected LLM calls: 8 seeds x 2 dealers x 300 = 4,800 (Haiku), only if launched
# One-sided market (two_sided false): dealer_v1 shows no inventory or cash; prices in units of alpha = 1.
name: PC-H-dealer-repair
tier: 0
prereg_id: PREREG-v1
seeds: [9101, 9102, 9103, 9104, 9105, 9106, 9107, 9108]
max_concurrent_runs: 8
lanes:
  anthropic_haiku: {provider: anthropic, models: [claude-haiku-5-5], max_in_flight: 48, budget_usd: 4.0}
base:
  name: PC-H-dealer-repair
  periods: 300
  ticks_per_period: 1
  market:
    mechanism: dealer
    n_dealers: 2
    cost: 1.0
    alpha: 1.0
    price_grid: {min: 1.0, max: 4.0, tick: 0.01}
    routing: {tau: null, outside_utility: 0.0}
    demand: {kind: closed_form_logit, a: 2.0, a0: 0.0, mu: 0.25, beta: 100.0}
    fringe: {share: 0.0, horizon_ticks: 50}
  swarm:
    mode: closed_form
    n_agents: 10000
  llm:
    memory_step: 25
    lane: anthropic_haiku
    mode: live
    allow_mixed_families: false
    params: {effort: low, max_tokens: 2048}
    slots:
    - {name: Dealer A, role: dealer, model: claude-haiku-5-5, family: anthropic, prompt: dealer_v1, prefix: P1, memory_periods: 100}
    - {name: Dealer B, role: dealer, model: claude-haiku-5-5, family: anthropic, prompt: dealer_v1, prefix: P1, memory_periods: 100}
  view: {id: V0, history_periods: 100}
  clock: {mode: sync, epoch_ticks: 1}
  checkpoint: {every_periods: 25, keep_last: 3}
  logging: {store_prompts: true, snapshot_every: 50}
  events: []
  tags:
    arm: dealer_template
    label: PC-H-dealer
    variant: repair
