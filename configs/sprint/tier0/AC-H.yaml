# AC-H -- Anchoring control (registered instrument check, D-16): 1 Haiku dealer + 3 scripted best_responder dealers, from scratch.
# PREREG section 1 (instrument validity: does a single dealer_v1 agent track the competitive best response when every rival is a
# scripted best responder, or does the template anchor prices above it?); docs/03_preregistration/campaign_table.md.
# Expected LLM calls: 4 seeds x 1 LLM x 100 = 400
# Same market, view, clock and prompt (dealer_v1, prefix P1) as TR-H; slots B-D play the SC1 policy (static best response to the
# rivals' last quotes, D-10), so any premium of slot A over the best-response price is the template's own anchoring, not coordination.
# allow_mixed_families is true because the scripted slots are family `mock`; they make no LLM call.
name: AC-H
tier: 0
prereg_id: PREREG-v1
seeds: [0, 1, 2, 3]
max_concurrent_runs: 4
lanes:
  anthropic_haiku: {provider: anthropic, models: [claude-haiku-5-5], max_in_flight: 48, budget_usd: 3.0}
base:
  name: AC-H
  periods: 100
  ticks_per_period: 100
  market:
    mechanism: dealer
    n_dealers: 4
    cost: 1.0
    alpha: 1.0
    price_grid: {min: 1.0, max: 4.0, tick: 0.05}
    routing: {tau: null, outside_utility: 0.0}
    demand: {kind: swarm, a: 2.0, a0: 0.0, mu: 0.25, beta: 100.0}
    fringe: {share: 0.0, horizon_ticks: 50}
  swarm:
    mode: agents
    n_agents: 10000
    arrivals: {lam_mean: 0.0001, lam_sd_log: 0.5}
    type_weights: {ZI_BUYER: 0.75, INFORMED: 0.1, NOISE: 0.1, TREND: 0.05}
  llm:
    memory_step: 25
    lane: anthropic_haiku
    mode: live
    allow_mixed_families: true
    params: {effort: low, max_tokens: 2048}
    slots:
    - {name: Dealer A, role: dealer, model: claude-haiku-5-5, family: anthropic, prompt: dealer_v1, prefix: P1, memory_periods: 100}
    - {name: Dealer B, role: dealer, model: scripted, family: mock, policy: best_responder}
    - {name: Dealer C, role: dealer, model: scripted, family: mock, policy: best_responder}
    - {name: Dealer D, role: dealer, model: scripted, family: mock, policy: best_responder}
  view: {id: V0, show_rival_quotes: true, show_trades: true, history_periods: 100}
  clock: {mode: sync, epoch_ticks: 100}
  checkpoint: {every_periods: 10, keep_last: 3}
  logging: {swarm_order_sample: 0.01, snapshot_every: 10, snapshot_levels: 10, store_prompts: true}
  events: []
  tags:
    arm: AC
    label: AC-H
