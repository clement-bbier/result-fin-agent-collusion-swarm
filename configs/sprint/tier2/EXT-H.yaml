# EXT-H -- Seed extension: 4 additional trunks (seeds 12-15) with the sham and the five Tier 0 levers.
# PREREG section 2 noise rule / campaign_table.md Tier 2 (seeds 9-12 extension); docs/03_preregistration/campaign_table.md.
# Expected LLM calls: 4 trunks x 400 + 6 branches x 4 x 50 x 4 = 1,600 + 4,800 = 6,400
# Interpretation: under the revised budget all 12 trunks (seeds 0-11) are already branched, so the PREREG's 'seeds 9-12' extension is realised as 4 NEW trunks (seeds 12-15). Added only by the blind noise rule (sigma_d_hat > 0.22).
name: TR-H
tier: 2
prereg_id: PREREG-v1
seeds: [12, 13, 14, 15]
max_concurrent_runs: 4
lanes:
  anthropic_haiku: {provider: anthropic, models: [claude-haiku-5-5], max_in_flight: 48, budget_usd: 2.0}
base:
  name: TR-H
  periods: 100
  ticks_per_period: 100
  market:
    mechanism: dealer
    n_dealers: 4
    cost: 1.0
    alpha: 1.0
    price_grid: {min: 1.0, max: 4.0, tick: 0.05}
    routing: {tau: null, outside_utility: 0.0}
    demand: {kind: swarm, a: 2.0, a0: 0.0, mu: 0.25, beta: 100.0}
    fringe: {share: 0.0, horizon_ticks: 50}
  swarm:
    mode: agents
    n_agents: 10000
    arrivals: {lam_mean: 0.0001, lam_sd_log: 0.5}
    type_weights: {ZI_BUYER: 0.75, INFORMED: 0.1, NOISE: 0.1, TREND: 0.05}
  llm:
    memory_step: 25
    lane: anthropic_haiku
    mode: live
    allow_mixed_families: false
    params: {effort: low, max_tokens: 2048}
    slots:
    - {name: Dealer A, role: dealer, model: claude-haiku-5-5, family: anthropic, prompt: dealer_v1, prefix: P1, memory_periods: 100}
    - {name: Dealer B, role: dealer, model: claude-haiku-5-5, family: anthropic, prompt: dealer_v1, prefix: P1, memory_periods: 100}
    - {name: Dealer C, role: dealer, model: claude-haiku-5-5, family: anthropic, prompt: dealer_v1, prefix: P1, memory_periods: 100}
    - {name: Dealer D, role: dealer, model: claude-haiku-5-5, family: anthropic, prompt: dealer_v1, prefix: P1, memory_periods: 100}
  view: {id: V0, show_rival_quotes: true, show_trades: true, history_periods: 100}
  clock: {mode: sync, epoch_ticks: 100}
  checkpoint: {every_periods: 10, keep_last: 3}
  logging: {swarm_order_sample: 0.01, snapshot_every: 10, snapshot_levels: 10, store_prompts: true}
  events: []
  tags:
    arm: trunk
    label: TR-H
branches:
- name: sham
  parent: TR-H
  at: period:100
  events:
  - type: set_param
    path: periods
    value: 150
  - type: set_param
    path: tags.arm
    value: sham
  - type: set_param
    path: tags.label
    value: EXT-H
- name: L1
  parent: TR-H
  at: period:100
  events:
  - type: set_param
    path: periods
    value: 150
  - type: set_param
    path: tags.arm
    value: L1
  - type: set_param
    path: tags.label
    value: EXT-H
  - type: set_param
    path: market.routing.tau
    value: 0.0625
  - type: set_param
    path: tags.level
    value: s3
- name: L2
  parent: TR-H
  at: period:100
  events:
  - type: set_param
    path: periods
    value: 150
  - type: set_param
    path: tags.arm
    value: L2
  - type: set_param
    path: tags.label
    value: EXT-H
  - type: set_param
    path: market.fringe.share
    value: 0.3
- name: L3
  parent: TR-H
  at: period:100
  events:
  - type: set_param
    path: periods
    value: 150
  - type: set_param
    path: tags.arm
    value: L3
  - type: set_param
    path: tags.label
    value: EXT-H
  - type: set_param
    path: market.price_grid.tick
    value: 0.01
- name: L4a
  parent: TR-H
  at: period:100
  events:
  - type: set_param
    path: periods
    value: 150
  - type: set_param
    path: tags.arm
    value: L4a
  - type: set_param
    path: tags.label
    value: EXT-H
  - type: set_param
    path: view.id
    value: V1
  - type: set_param
    path: view.anonymise_ids
    value: true
  - type: set_param
    path: view.canonicalise
    value: true
  - type: set_param
    path: view.price_round
    value: 0.05
  - type: set_param
    path: view.size_round
    value: 1.0
- name: L6
  parent: TR-H
  at: period:100
  events:
  - type: set_param
    path: periods
    value: 150
  - type: set_param
    path: tags.arm
    value: L6
  - type: set_param
    path: tags.label
    value: EXT-H
  - type: add_scripted_agent
    policy: no_regret_mm
    params: {n_prices: 31, horizon: 50}
