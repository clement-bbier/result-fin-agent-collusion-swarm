# PREV-L6-H -- EXPLORATORY prevention (A-020): a no-regret (EXP3) seller present from period 0 next to 4 Haiku dealers (Garra-style design, our swarm market). 4 seeds x 100 periods x 4 LLM dealers = 1,600 calls.
# PREV-L6-H -- Prevention: fringe share 0.30 from period 0 (A2 trunk otherwise).
# PREREG section 3 H3 prevention; campaign_table.md Tier 2; docs/03_preregistration/campaign_table.md.
# Expected LLM calls: 4 seeds x 4 x 100 = 1,600
name: PREV-L6-H
tier: 2
prereg_id: PREREG-v1
seeds: [0, 1, 2, 3]
max_concurrent_runs: 4
lanes:
  anthropic_haiku: {provider: anthropic, models: [claude-haiku-5-5], max_in_flight: 48, budget_usd: 2.0}
base:
  name: PREV-L6-H
  periods: 100
  ticks_per_period: 100
  market:
    mechanism: dealer
    n_dealers: 5
    cost: 1.0
    alpha: 1.0
    price_grid: {min: 1.0, max: 4.0, tick: 0.05}
    routing: {tau: null, outside_utility: 0.0}
    demand: {kind: swarm, a: 2.0, a0: 0.0, mu: 0.25, beta: 100.0}
    fringe: {share: 0.0, horizon_ticks: 50}
  swarm:
    mode: agents
    n_agents: 10000
    arrivals: {lam_mean: 0.0001, lam_sd_log: 0.5}
    type_weights: {ZI_BUYER: 0.75, INFORMED: 0.1, NOISE: 0.1, TREND: 0.05}
  llm:
    memory_step: 25
    lane: anthropic_haiku
    mode: live
    allow_mixed_families: true
    params: {effort: low, max_tokens: 2048}
    slots:
    - {name: Dealer A, role: dealer, model: claude-haiku-5-5, family: anthropic, prompt: dealer_v1, prefix: P1, memory_periods: 100}
    - {name: Dealer B, role: dealer, model: claude-haiku-5-5, family: anthropic, prompt: dealer_v1, prefix: P1, memory_periods: 100}
    - {name: Dealer C, role: dealer, model: claude-haiku-5-5, family: anthropic, prompt: dealer_v1, prefix: P1, memory_periods: 100}
    - {name: Dealer D, role: dealer, model: claude-haiku-5-5, family: anthropic, prompt: dealer_v1, prefix: P1, memory_periods: 100}
    - {name: Entrant E, role: dealer, model: scripted, family: mock, policy: 'no_regret_mm(n_prices=31, horizon=50)'}
  view: {id: V0, show_rival_quotes: true, show_trades: true, history_periods: 100}
  clock: {mode: sync, epoch_ticks: 100}
  checkpoint: {every_periods: 10, keep_last: 3}
  logging: {swarm_order_sample: 0.01, snapshot_every: 10, snapshot_levels: 10, store_prompts: true}
  events: []
  tags:
    arm: prevention_L6
    label: PREV-L6-H
