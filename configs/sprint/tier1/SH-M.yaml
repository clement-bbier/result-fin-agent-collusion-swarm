# SH-M -- Sham on the second-family trunks (A-005: Llama-3.3-70B, lane openrouter_llama): branch from each TR-M trunk at T0 = 100, +50 periods, no change.
# PREREG section 4 Controls (sham intervention) and section 2 H1-M pairing; docs/03_preregistration/campaign_table.md.
# Expected LLM calls: 6 branches x 4 x 50 = 1,200 (lane budget line 2.0 USD; the Mistral free lane was dropped by A-005)
# Parent trunk: TR-M (campaign name = run name = TR-M, so trunk run ids are shared with TR-M.yaml
# and resume skips them; run TR-M first, otherwise this file re-simulates the 6 trunks).
# The dry-run projection counts the trunks too; branch-only calls are in docs/04_runbooks/campaigns.md.
# The branch only sets tags (arm=sham, label) and the horizon, exactly as SH-H does on TR-H.
name: TR-M
tier: 1
prereg_id: PREREG-v1
seeds: [0, 1, 2, 3, 4, 5]
max_concurrent_runs: 6
lanes:
  openrouter_llama: {provider: openrouter, models: [meta-llama/llama-3.3-70b-instruct], max_in_flight: 4, budget_usd: 2.0}
base:
  name: TR-M
  periods: 100
  ticks_per_period: 100
  market:
    mechanism: dealer
    n_dealers: 4
    cost: 1.0
    alpha: 1.0
    price_grid: {min: 1.0, max: 4.0, tick: 0.05}
    routing: {tau: null, outside_utility: 0.0}
    demand: {kind: swarm, a: 2.0, a0: 0.0, mu: 0.25, beta: 100.0}
    fringe: {share: 0.0, horizon_ticks: 50}
  swarm:
    mode: agents
    n_agents: 10000
    arrivals: {lam_mean: 0.0001, lam_sd_log: 0.5}
    type_weights: {ZI_BUYER: 0.75, INFORMED: 0.1, NOISE: 0.1, TREND: 0.05}
  llm:
    memory_step: 25
    lane: openrouter_llama
    mode: live
    allow_mixed_families: false
    params: {effort: null, max_tokens: 2048, temperature: 1.0}
    slots:
    - {name: Dealer A, role: dealer, model: meta-llama/llama-3.3-70b-instruct, family: llama, prompt: dealer_v1, prefix: P1, memory_periods: 100}
    - {name: Dealer B, role: dealer, model: meta-llama/llama-3.3-70b-instruct, family: llama, prompt: dealer_v1, prefix: P1, memory_periods: 100}
    - {name: Dealer C, role: dealer, model: meta-llama/llama-3.3-70b-instruct, family: llama, prompt: dealer_v1, prefix: P1, memory_periods: 100}
    - {name: Dealer D, role: dealer, model: meta-llama/llama-3.3-70b-instruct, family: llama, prompt: dealer_v1, prefix: P1, memory_periods: 100}
  view: {id: V0, show_rival_quotes: true, show_trades: true, history_periods: 100}
  clock: {mode: sync, epoch_ticks: 100}
  checkpoint: {every_periods: 10, keep_last: 3}
  logging: {swarm_order_sample: 0.01, snapshot_every: 10, snapshot_levels: 10, store_prompts: true}
  events: []
  tags:
    arm: trunk
    label: TR-M
branches:
- name: sham
  parent: TR-M
  at: period:100
  events:
  - type: set_param
    path: periods
    value: 150
  - type: set_param
    path: tags.arm
    value: sham
  - type: set_param
    path: tags.label
    value: SH-M
