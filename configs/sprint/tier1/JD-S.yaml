# JD-S -- PLACEHOLDER for the judge configuration, consumed by the metrics judge, NOT by the runner.
# PREREG section 3 H9 / DETECTION_PROTOCOL (judge); docs/03_preregistration/campaign_table.md.
# Expected LLM calls: about 1,100 Sonnet judge calls (table); this file makes none
# The schema has no judge section, so the settings live in the tags of a one-period mock shell that validates (do not launch it as a campaign):
# judge_model claude-sonnet-5-5 (lane anthropic_sonnet) for Haiku runs; for Sonnet-arm runs meta-llama/llama-3.3-70b-instruct
# (alias llama-70b, paid lane openrouter_llama; backup gemini-3.5-flash-lite); judge_rubric judge_v1, 8 scratchpads per window.
name: JD-S
tier: 1
prereg_id: PREREG-v1
seeds: [0]
max_concurrent_runs: 1
lanes:
  anthropic_sonnet: {provider: anthropic, models: [claude-sonnet-5-5], max_in_flight: 16, budget_usd: 7.0}
base:
  name: JD-S
  periods: 1
  ticks_per_period: 100
  market:
    mechanism: dealer
    n_dealers: 1
    cost: 1.0
    alpha: 1.0
    price_grid: {min: 1.0, max: 4.0, tick: 0.05}
    routing: {tau: null, outside_utility: 0.0}
    demand: {kind: swarm, a: 2.0, a0: 0.0, mu: 0.25, beta: 100.0}
    fringe: {share: 0.0, horizon_ticks: 50}
  swarm:
    mode: agents
    n_agents: 10000
    arrivals: {lam_mean: 0.0001, lam_sd_log: 0.5}
    type_weights: {ZI_BUYER: 0.75, INFORMED: 0.1, NOISE: 0.1, TREND: 0.05}
  llm:
    memory_step: 25
    lane: mock
    mode: mock
    allow_mixed_families: false
    params: {effort: low, max_tokens: 2048}
    slots:
    - {name: Dealer A, role: dealer, model: scripted, family: mock, policy: static_nash}
  view: {id: V0, show_rival_quotes: true, show_trades: true, history_periods: 100}
  clock: {mode: sync, epoch_ticks: 100}
  checkpoint: {every_periods: 10, keep_last: 3}
  logging: {swarm_order_sample: 0.01, snapshot_every: 10, snapshot_levels: 10, store_prompts: true}
  events: []
  tags:
    judge_model: claude-sonnet-5-5
    judge_model_sonnet_arm: llama-70b
    judge_lane_sonnet_arm: openrouter_llama
    judge_backup_sonnet_arm: gemini-3.5-flash-lite
    judge_rubric: judge_v1
    scratchpads_per_window: '8'
    arm: judge
    label: JD-S
