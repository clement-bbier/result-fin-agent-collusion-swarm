# GR-H -- Routing gradient from scratch at s1, s2, s3, s4 (4 seeds each, CRN).
# PREREG section 3 H2 gradient; docs/03_preregistration/campaign_table.md.
# Expected LLM calls: 4 levels x 4 seeds x 4 x 100 = 6,400 (table 4,800 + 1,600 for the CRN-paired s1, second review)
# Seeds 3001-3004 are the CRN background seeds: the same seed at every routing level shares the swarm population and arrival streams.
# tau (alpha = 1, lower = more price-sensitive): s1 = null (= alpha * mu = 0.25, as TR-H), s2 = 0.125, s3 = 0.0625, s4 = 0.02.
# The s1 level runs at the same CRN seeds as s2-s4 so H2 is tested within seed groups (second review); TR-H stays the Gate 2 trunk set.
name: GR-H
tier: 1
prereg_id: PREREG-v1
seeds: [3001, 3002, 3003, 3004]
max_concurrent_runs: 12
lanes:
  anthropic_haiku: {provider: anthropic, models: [claude-haiku-5-5], max_in_flight: 48, budget_usd: 3.0}
grid:
  # tau zipped with the level label (tags.level) so every run carries its registered level
  market.routing.tau+tags.level:
  - [null, s1]
  - [0.125, s2]
  - [0.0625, s3]
  - [0.02, s4]
base:
  name: GR-H
  periods: 100
  ticks_per_period: 100
  market:
    mechanism: dealer
    n_dealers: 4
    cost: 1.0
    alpha: 1.0
    price_grid: {min: 1.0, max: 4.0, tick: 0.05}
    routing: {tau: null, outside_utility: 0.0}
    demand: {kind: swarm, a: 2.0, a0: 0.0, mu: 0.25, beta: 100.0}
    fringe: {share: 0.0, horizon_ticks: 50}
  swarm:
    mode: agents
    n_agents: 10000
    arrivals: {lam_mean: 0.0001, lam_sd_log: 0.5}
    type_weights: {ZI_BUYER: 0.75, INFORMED: 0.1, NOISE: 0.1, TREND: 0.05}
  llm:
    memory_step: 25
    lane: anthropic_haiku
    mode: live
    allow_mixed_families: false
    params: {effort: low, max_tokens: 2048}
    slots:
    - {name: Dealer A, role: dealer, model: claude-haiku-5-5, family: anthropic, prompt: dealer_v1, prefix: P1, memory_periods: 100}
    - {name: Dealer B, role: dealer, model: claude-haiku-5-5, family: anthropic, prompt: dealer_v1, prefix: P1, memory_periods: 100}
    - {name: Dealer C, role: dealer, model: claude-haiku-5-5, family: anthropic, prompt: dealer_v1, prefix: P1, memory_periods: 100}
    - {name: Dealer D, role: dealer, model: claude-haiku-5-5, family: anthropic, prompt: dealer_v1, prefix: P1, memory_periods: 100}
  view: {id: V0, show_rival_quotes: true, show_trades: true, history_periods: 100}
  clock: {mode: sync, epoch_ticks: 100}
  checkpoint: {every_periods: 10, keep_last: 3}
  logging: {swarm_order_sample: 0.01, snapshot_every: 10, snapshot_levels: 10, store_prompts: true}
  events: []
  tags:
    arm: gradient
    label: GR-H
