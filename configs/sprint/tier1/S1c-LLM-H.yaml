# S1c-LLM-H -- H8's competitive side on LLM markets, part 1: both sting probes on the CA-H ("compete aggressively") runs.
# PREREG section 3 H8 sting (competitive side; second review); docs/03_preregistration/campaign_table.md.
# Expected LLM calls: 2 probes x 4 CA-H runs x 4 x 50 = 1,600 (part 2, S1c-LLM-TR-H.yaml, adds <= 600: total <= 2,200)
# Parent runs: CA-H (campaign name = run name = CA-H, so the 4 trunk run ids are shared with CA-H.yaml and resume skips them;
# run CA-H first, otherwise this file re-simulates the 4 CA-H runs). The dry-run projection counts the CA-H runs too.
# S1 = regulator dealer in the first entrant seat (slot 4) shadows the mean quote then raises it by 0.2 (hold 5 epochs, 3 probes),
# S2 = forced deviation, slot 0 cuts its price by 0.3 for 1 period: the same events as S1-H / S2-H, so the impulse responses of
# instruction-competitive LLM markets are directly comparable with the collusive trunks' (process labels, DETECTION section 1).
name: CA-H
tier: 1
prereg_id: PREREG-v1
seeds: [0, 1, 2, 3]
max_concurrent_runs: 8
lanes:
  anthropic_haiku: {provider: anthropic, models: [claude-haiku-5-5], max_in_flight: 48, budget_usd: 3.0}
base:
  name: CA-H
  periods: 100
  ticks_per_period: 100
  market:
    mechanism: dealer
    n_dealers: 4
    cost: 1.0
    alpha: 1.0
    price_grid: {min: 1.0, max: 4.0, tick: 0.05}
    routing: {tau: null, outside_utility: 0.0}
    demand: {kind: swarm, a: 2.0, a0: 0.0, mu: 0.25, beta: 100.0}
    fringe: {share: 0.0, horizon_ticks: 50}
  swarm:
    mode: agents
    n_agents: 10000
    arrivals: {lam_mean: 0.0001, lam_sd_log: 0.5}
    type_weights: {ZI_BUYER: 0.75, INFORMED: 0.1, NOISE: 0.1, TREND: 0.05}
  llm:
    memory_step: 25
    lane: anthropic_haiku
    mode: live
    allow_mixed_families: false
    params: {effort: low, max_tokens: 2048}
    slots:
    - {name: Dealer A, role: dealer, model: claude-haiku-5-5, family: anthropic, prompt: dealer_v1, prefix: CA, memory_periods: 100}
    - {name: Dealer B, role: dealer, model: claude-haiku-5-5, family: anthropic, prompt: dealer_v1, prefix: CA, memory_periods: 100}
    - {name: Dealer C, role: dealer, model: claude-haiku-5-5, family: anthropic, prompt: dealer_v1, prefix: CA, memory_periods: 100}
    - {name: Dealer D, role: dealer, model: claude-haiku-5-5, family: anthropic, prompt: dealer_v1, prefix: CA, memory_periods: 100}
  view: {id: V0, show_rival_quotes: true, show_trades: true, history_periods: 100}
  clock: {mode: sync, epoch_ticks: 100}
  checkpoint: {every_periods: 10, keep_last: 3}
  logging: {swarm_order_sample: 0.01, snapshot_every: 10, snapshot_levels: 10, store_prompts: true}
  events: []
  tags:
    arm: CA
    label: CA-H
branches:
- name: S1
  parent: CA-H
  at: period:100
  events:
  - type: set_param
    path: periods
    value: 150
  - type: set_param
    path: tags.arm
    value: S1c
  - type: set_param
    path: tags.label
    value: S1c-LLM-H
  - type: set_param
    path: tags.probe
    value: S1
  - type: sting
    slot: 4
    delta: 0.2
    shadow_epochs: 5
    hold_epochs: 5
    probes: 3
- name: S2
  parent: CA-H
  at: period:100
  events:
  - type: set_param
    path: periods
    value: 150
  - type: set_param
    path: tags.arm
    value: S1c
  - type: set_param
    path: tags.label
    value: S1c-LLM-H
  - type: set_param
    path: tags.probe
    value: S2
  - type: forced_deviation
    slot: 0
    delta: 0.3
    periods: 1
