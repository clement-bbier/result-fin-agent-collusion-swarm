# finswarm LLM catalogue: providers, models, prices and lanes (owner: llm workstream).
#
# Prices are USD per million tokens, verified against the official Claude Platform pricing page on 2026-10-09
# (cache read = 0.1x input on Haiku 5.5, 0.05x on Sonnet 5.5 / Opus 5.5; 5-minute cache write = 1.25x input;
# 1-hour cache write = 2x input; Batch API = 50 % off; Haiku 5.5 prompts > 100k tokens use the long rate card).
# `verified: false` marks the best current figure,
# to be re-checked in the provider console before it is used for budgeting.
# Lanes are validated by finswarm.config.schema.LaneConfig (extra keys are errors).
# API keys are never stored here: `env_key` names the variable read from .env by
# finswarm.llm.keys (python-dotenv). Keys are never logged.
version: 1

defaults:
  timeout_s: 120.0        # per attempt
  max_attempts: 6         # first try + 5 retries (429 / 5xx / timeouts / connection)
  backoff_base_s: 1.0     # full-jitter exponential backoff, capped
  backoff_cap_s: 60.0
  aimd_decrease: 0.7      # multiplicative decrease of the lane rate on 429
  aimd_increase_per_min: 0.05  # additive recovery (fraction of the configured rate per minute)

providers:
  anthropic:
    kind: anthropic       # official `anthropic` SDK only (AsyncAnthropic); never an OpenAI shim
    env_key: ANTHROPIC_API_KEY
    capabilities:
      supports_seed: false
      supports_temperature: false   # Haiku/Sonnet/Opus 5.5 reject non-default sampling values
      supports_json_schema: true    # output_config.format = json_schema
      supports_cache_control: true
      free: false
  mistral:
    kind: mistral         # official `mistralai` SDK, chat.complete_async
    env_key: MISTRAL_API_KEY
    json_mode: true       # response_format = {"type": "json_object"}
    capabilities:
      supports_seed: true
      supports_temperature: true
      supports_json_schema: false
      supports_cache_control: false
      free: true
  # Groq was dropped on 2026-10-09: HTTP 403 "Access denied" at Cloudflare from the author's
  # network even without a key. The Llama family runs through OpenRouter instead.
  gemini:
    kind: openai_compat   # Gemini's OpenAI-compatible endpoint
    env_key: GEMINI_API_KEY
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    json_mode: true
    capabilities:
      supports_seed: true
      supports_temperature: true
      supports_json_schema: false
      supports_cache_control: false
      free: true
  openrouter:
    kind: openai_compat
    env_key: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    json_mode: false      # :free models vary; rely on prompt-instructed JSON + repair
    capabilities:
      supports_seed: true
      supports_temperature: true
      supports_json_schema: false
      supports_cache_control: false
      free: false           # carries the paid Llama lane; :free variants cost 0 through their price
  mock:
    kind: mock
    env_key: null
    capabilities:
      supports_seed: true
      supports_temperature: true
      supports_json_schema: true
      supports_cache_control: false
      free: true

models:
  # --- Anthropic (paid). Ids are used verbatim, never with a date suffix. -------------
  claude-haiku-5-5:
    provider: anthropic
    role: agents (default)
    price:
      input: 0.10
      output: 0.50
      cache_read: 0.01              # official (0.1x); 0.05 above 100k tokens
      cache_write: 0.125            # 5-minute cache write (1.25x input); 1-hour write 0.20; batch 0.05 / 0.25
      long_context_tokens: 100000   # prompts above this use the long rate card (0.50 / 2.50)
      input_long: 0.50
      output_long: 2.50
      verified: true
  claude-sonnet-5-5:
    provider: anthropic
    role: capability arm and judge
    price:
      input: 2.00
      output: 10.00
      cache_read: 0.10              # official (0.05x on Sonnet 5.5)
      cache_write: 2.50             # 5-minute write (1.25x); 1-hour write 4.00; batch 1.00 / 5.00
      verified: true
  claude-opus-5-5:
    provider: anthropic
    role: optional
    price:
      input: 4.00
      output: 20.00
      cache_read: 0.20              # official (0.05x on Opus 5.5)
      cache_write: 5.00             # 5-minute write (1.25x); 1-hour write 8.00; batch 2.00 / 10.00
      verified: true
  # --- Free lanes (cost 0). Ids answered a live one-word request on 2026-10-09/10. ---------
  # Mistral Experiment tier on this account: mistral-small/medium/large and magistral answer
  # 429 with `x-ratelimit-limit-req-minute: 0`; the ministral family is open.
  ministral-8b-latest:
    provider: mistral
    role: Mistral family (lane M); 188 req/min and 625k tokens/min measured
    price: {input: 0.0, output: 0.0, verified: true}
  ministral-14b-latest:
    provider: mistral
    role: Mistral family, larger model; 30 req/min measured
    price: {input: 0.0, output: 0.0, verified: true}
  ministral-3b-latest:
    provider: mistral
    role: Mistral family, fast fallback; 750 req/min measured
    price: {input: 0.0, output: 0.0, verified: true}
  gemini-3.5-flash-lite:
    provider: gemini
    role: backup judge
    # 2026-10-09: gemini-2.5-flash-lite is "no longer available to new users" (404 from the API)
    price: {input: 0.0, output: 0.0, verified: true}
  gemini-3-flash-preview:
    provider: gemini
    # 2026-10-10: replaces gemini-2.5-flash, also closed to new users (404)
    price: {input: 0.0, output: 0.0, verified: true}
  google/gemma-4-31b-it:free:
    provider: openrouter
    # 2026-10-09: llama-3.3-70b-instruct:free was withdrawn (404); current :free list checked live
    price: {input: 0.0, output: 0.0, verified: true}
  nvidia/nemotron-3-super-120b-a12b:free:
    provider: openrouter
    price: {input: 0.0, output: 0.0, verified: true}
  # --- Llama family via OpenRouter (paid, cents). Prices read from /api/v1/models, 2026-10-09.
  meta-llama/llama-3.3-70b-instruct:
    provider: openrouter
    role: judge for Sonnet-arm runs and third family (replaces the unreachable Groq lane)
    price: {input: 0.22, output: 0.50, verified: true}
  meta-llama/llama-3.1-8b-instruct:
    provider: openrouter
    price: {input: 0.05, output: 0.08, verified: true}
  mock-v1:
    provider: mock
    price: {input: 0.0, output: 0.0, verified: true}

# Short names accepted in run configs. They resolve to the verbatim ids above (requests,
# cache keys, ledgers and manifests always carry the verbatim id).
aliases:
  haiku: claude-haiku-5-5
  sonnet: claude-sonnet-5-5
  opus: claude-opus-5-5
  ministral-8b: ministral-8b-latest
  ministral-14b: ministral-14b-latest
  ministral-3b: ministral-3b-latest
  llama-70b: meta-llama/llama-3.3-70b-instruct
  llama-8b: meta-llama/llama-3.1-8b-instruct
  mock: mock-v1

lanes:
  anthropic_haiku:
    provider: anthropic
    models: [claude-haiku-5-5]
    max_in_flight: 48     # measured 2026-10-10: 10,000 req/min, 12 M tokens/min; runs are period-sequential, AIMD on 429
    budget_usd: 60.0      # Haiku arms project to about 35 USD with memory_step 25 (period-100 pricing); global stop in budget.yaml
  anthropic_sonnet:
    provider: anthropic
    models: [claude-sonnet-5-5, claude-opus-5-5]
    max_in_flight: 16
    budget_usd: 150.0     # Sonnet arm after truncation steps 1-3 (PC-S measured 43 USD); global stop 195 in budget.yaml binds
  mistral_free:
    provider: mistral
    models: [ministral-8b-latest, ministral-14b-latest, ministral-3b-latest]
    rpm: 150              # measured 188 req/min on ministral-8b-latest (2026-10-09); margin kept
    tpm: 600000           # measured 625k tokens/min
    max_in_flight: 12     # 2026-10-10 11:10: 6.8 s per call, 150 rpm never reached at 4 in flight
    free: true
  gemini_free:
    provider: gemini
    models: [gemini-3.5-flash-lite, gemini-3-flash-preview]
    rpm: 15
    rpd: 500
    max_in_flight: 2
    free: true
  openrouter_free:
    provider: openrouter
    models: ["google/gemma-4-31b-it:free", "nvidia/nemotron-3-super-120b-a12b:free"]
    rpm: 20
    rpd: 1000             # 10 USD of credits bought 2026-10-10 03:18Z -> 1,000/day (50 unfunded)
    max_in_flight: 1
    free: true
  openrouter_llama:
    provider: openrouter
    models: [meta-llama/llama-3.3-70b-instruct, meta-llama/llama-3.1-8b-instruct]
    max_in_flight: 12      # paid variants have no platform-level request cap (OpenRouter docs)
    budget_usd: 10.0      # matches the 10 USD credit purchase on the account
  mock:
    provider: mock
    models: [mock-v1]
    max_in_flight: 64
    free: true
