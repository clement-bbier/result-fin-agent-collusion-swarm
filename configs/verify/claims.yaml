    params: {arm: sham, treatment_runs: "{camp}/TR-H/*", family: [L1, L2, L3, L4a, L5, L6, L7, L8], qualified_from: "{out}/TR-H/stats.json", window: branch, members: [0, 1, 2, 3], bench: "{bench:TR-H:trunk}", cap: 1.0, run_metric: delta_price, lever: L1, stat: p_holm}
    source: {file: "{out}/TR-H/stats.json", path: "h1r.levers.L1.p_holm"}
    tolerance_rel: 1.0e-6
    tolerance_abs: 1.0e-9
    alpha: 0.05
  C3b_holm_p_L3:
    claim: C3b
    metric: holm_family
    runs: "{camp}/TR-H/*"
    params: {arm: sham, treatment_runs: "{camp}/TR-H/*", family: [L1, L2, L3, L4a, L5, L6, L7, L8], qualified_from: "{out}/TR-H/stats.json", window: branch, members: [0, 1, 2, 3], bench: "{bench:TR-H:trunk}", cap: 1.0, run_metric: delta_price, lever: L3, stat: p_holm}
