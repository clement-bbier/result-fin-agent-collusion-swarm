# Claims -> verify rows (paper/claims.md C1..C10; SAP section 12). Read by
# finswarm.analysis.numbers (`scripts/analyze.py --numbers`) to produce paper/numbers.json: for
# every row the EXPECTED value is copied from the registered analysis outputs (stats.json,
# gates.json, family_s.json, detection report.json) and scripts/verify.py re-derives it from
# the raw logs with no finswarm code. A claim whose expected value is not yet available is
# written with expected null and verifies as "pending".
#
# source: {file: <analysis output>, path: <dotted path into its JSON>}; "{out}" expands to the
# analysis out-root, "{camp}" to the campaigns root. runs: glob of run directories (verify.py).
# Benchmarks are pinned values: "{bench:<pin>:<market>}" expands to the pinned p_N/p_M/pi_N/pi_M
# of configs/analysis/benchmarks/<pin>.json via the registry.
version: 1
tolerance_default: 0.005
windows: {branch: [111, 150], trunk: [71, 100], fish: [251, 300]}
members: [0, 1, 2, 3]

claims:
  # ---------------------------------------------------------------- C1 / C1b / C1c (gates)
  C1_delta_p_mean:
    claim: C1
    metric: delta_price
    runs: "{camp}/PC-H/*"
    params: {window: fish, members: [0, 1], bench: run_closed_form, agg: mean}
    source: {file: "{out}/gates/gates.json", path: "gates.Gate 1 (PC-H).delta_p.mean"}
  C1_delta_p_ci_lo:
    claim: C1
    metric: delta_price
    runs: "{camp}/PC-H/*"
    params: {window: fish, members: [0, 1], bench: run_closed_form, agg: bca_lo, strata: alpha, B: 10000}
    source: {file: "{out}/gates/gates.json", path: "gates.Gate 1 (PC-H).delta_p.lo"}
    tolerance: 0.02
  C1_delta_p_ci_hi:
    claim: C1
    metric: delta_price
    runs: "{camp}/PC-H/*"
    params: {window: fish, members: [0, 1], bench: run_closed_form, agg: bca_hi, strata: alpha, B: 10000}
    source: {file: "{out}/gates/gates.json", path: "gates.Gate 1 (PC-H).delta_p.hi"}
    tolerance: 0.02
  C1_share_runs_above_0_10:
    claim: C1
    metric: delta_price
    runs: "{camp}/PC-H/*"
    params: {window: fish, members: [0, 1], bench: run_closed_form, agg: "share_above:0.10"}
    source: {file: "{out}/gates/gates.json", path: "gates.Gate 1 (PC-H).criteria.share_runs_above.value"}
    tolerance: 0.0
  C1_delta_pi_mean:
    claim: C1
    metric: delta
    runs: "{camp}/PC-H/*"
    params: {window: fish, members: [0, 1], bench: run_closed_form, agg: mean}
    source: {file: "{out}/gates/gates.json", path: "gates.Gate 1 (PC-H).delta_pi_mean"}
  C1_parse_fail_rate:
    claim: C1
    metric: parse_fail_rate
    runs: "{camp}/PC-H/*"
    params: {agg: pooled}
    source: {file: "{out}/gates/gates.json", path: "gates.Gate 1 (PC-H).criteria.parse_failures.value"}
    tolerance: 0.001
  C1b_delta_p_mean:
    claim: C1b
    metric: delta_price
    runs: "{camp}/PC-H-dealer/*"
    params: {window: fish, members: [0, 1], bench: run_closed_form, agg: mean}
    source: {file: "{out}/gates/gates.json", path: "gates.Gate 1b (PC-H-dealer).delta_p.mean"}
  C1b_delta_pi_mean:
    claim: C1b
    metric: delta
    runs: "{camp}/PC-H-dealer/*"
    params: {window: fish, members: [0, 1], bench: run_closed_form, agg: mean}
    source: {file: "{out}/gates/gates.json", path: "gates.Gate 1b (PC-H-dealer).delta_pi_mean"}
  C1c_anchoring_median_delta_p:
    claim: C1c
    metric: delta_price
    runs: "{camp}/AC-H/*"
    params: {window: trunk, members: [0], bench: "{bench:TR-H:trunk}", agg: median}
    source: {file: "{out}/gates/gates.json", path: "gates.AC-H anchoring diagnostic (AC-H).median_delta_p"}
  # ---------------------------------------------------------------- Gate 2 (established)
  G2_n_established:
    claim: C3a
    metric: established
    runs: "{camp}/TR-H/*"
    params: {arm: trunk, window: trunk, members: [0, 1, 2, 3], bench: "{bench:TR-H:trunk}", thresholds: {delta_price: 0.30, delta: 0.30}, agg: count}
    source: {file: "{out}/gates/gates.json", path: "gates.Gate 2 (TR-H).n_qualified"}
    tolerance: 0.0
  G2_trend_slope:
    claim: C3a
    metric: trend_slope
    runs: "{camp}/TR-H/*"
    params: {arm: trunk, window: [81, 100], members: [0, 1, 2, 3], bench: "{bench:TR-H:trunk}"}
    source: {file: "{out}/gates/gates.json", path: "gates.Gate 2 (TR-H).trend_rule.slope"}
    tolerance: 0.0005
  # ---------------------------------------------------------------- C2 gradient (H2)
  C2_spearman_rho:
    claim: C2
    metric: spearman_level
    runs: "{camp}/GR-H/*"
    params: {window: trunk, members: [0, 1, 2, 3], bench: run_closed_form, cap: 1.0, level_key: resolved_config.tags.level, level_map: {s1: 1, s2: 2, s3: 3, s4: 4}, group_key: seed, stat: rho}
    source: {file: "{out}/family_s/family_s.json", path: "hypotheses.H2.spearman.rho"}
  C2_spearman_p_perm:
    claim: C2
    metric: spearman_level
    runs: "{camp}/GR-H/*"
    params: {window: trunk, members: [0, 1, 2, 3], bench: run_closed_form, cap: 1.0, level_key: resolved_config.tags.level, level_map: {s1: 1, s2: 2, s3: 3, s4: 4}, group_key: seed, stat: p_perm, n_perm: 10000}
    source: {file: "{out}/family_s/family_s.json", path: "hypotheses.H2.spearman.p_perm"}
    tolerance: 0.01
  C2_s1_minus_s4:
    claim: C2
    metric: welch_one_sided
    runs: "{camp}/TR-H/*"
    params: {arm: trunk, window: trunk, members: [0, 1, 2, 3], bench: "{bench:TR-H:trunk}", cap: 1.0, treatment_runs: "{camp}/GR-H/*", treatment_filter: {resolved_config.tags.level: s4}, treatment_bench: run_closed_form, extra_runs: "{camp}/GR-H/*", extra_filter: {resolved_config.tags.level: s1}, mei: 0.30, stat: diff}
    source: {file: "{out}/family_s/family_s.json", path: "hypotheses.H2.welch_s1_minus_s4.diff"}
  # ---------------------------------------------------------------- C3a primary (H1)
  C3a_delta_c_p:
    claim: C3a
    metric: paired_contrast
    runs: "{camp}/TR-H/*"
    params: {arm: sham, treatment_runs: "{camp}/TR-H/*", treatment_arm: L2, qualified_from: "{out}/TR-H/stats.json", window: branch, members: [0, 1, 2, 3], bench: "{bench:TR-H:trunk}", cap: 1.0, run_metric: delta_price, stat: mean}
    source: {file: "{out}/TR-H/stats.json", path: "h1.mean"}
  C3a_p_trunk_scoring:
    claim: C3a
    metric: paired_contrast
    runs: "{camp}/TR-H/*"
    params: {arm: sham, treatment_runs: "{camp}/TR-H/*", treatment_arm: L2, qualified_from: "{out}/TR-H/stats.json", window: branch, members: [0, 1, 2, 3], bench: "{bench:TR-H:trunk}", cap: 1.0, run_metric: delta_price, stat: p_t_one_sided}
    source: {file: "{out}/TR-H/stats.json", path: "h1.p_one_sided"}
    tolerance: 0.001
  C3a_p_own_scoring:
    claim: C3a
    metric: paired_contrast
    runs: "{camp}/TR-H/*"
    params: {arm: sham, treatment_runs: "{camp}/TR-H/*", treatment_arm: L2, qualified_from: "{out}/TR-H/stats.json", window: branch, members: [0, 1, 2, 3], bench: "{bench:TR-H:trunk}", treatment_bench: "{bench:TR-H:L2}", cap: 1.0, run_metric: delta_price, stat: p_t_one_sided}
    source: {file: "{out}/TR-H/stats.json", path: "h1.own_scoring.p_one_sided"}
    tolerance: 0.001
  C3a_t_lower_bound_95:
    claim: C3a
    metric: paired_contrast
    runs: "{camp}/TR-H/*"
    params: {arm: sham, treatment_runs: "{camp}/TR-H/*", treatment_arm: L2, qualified_from: "{out}/TR-H/stats.json", window: branch, members: [0, 1, 2, 3], bench: "{bench:TR-H:trunk}", cap: 1.0, run_metric: delta_price, stat: t_lower_95}
    source: {file: "{out}/TR-H/stats.json", path: "h1.lower_bound_one_sided_95"}
  C3a_bca90_lo:
    claim: C3a
    metric: paired_contrast
    runs: "{camp}/TR-H/*"
    params: {arm: sham, treatment_runs: "{camp}/TR-H/*", treatment_arm: L2, qualified_from: "{out}/TR-H/stats.json", window: branch, members: [0, 1, 2, 3], bench: "{bench:TR-H:trunk}", cap: 1.0, run_metric: delta_price, stat: bca90_lo, B: 10000}
    source: {file: "{out}/TR-H/stats.json", path: "h1.practical_significance.bca_90.0"}
    tolerance: 0.02
  C3a_mqc_L2:
    claim: C3a
    metric: mqc_pp
    runs: "{camp}/SC-1/*"
    params: {arm: sham, label: MQC-L2, treatment_runs: "{camp}/SC-1/*", treatment_arm: L2, window: branch, stat: mean}
    source: {file: "{out}/TR-H/stats.json", path: "h1.mqc"}
    tolerance: 0.05
  # ---------------------------------------------------------------- C3b family (H1-R)
  C3b_holm_p_L2:
    claim: C3b
    metric: holm_family
    runs: "{camp}/TR-H/*"
    params: {arm: sham, treatment_runs: "{camp}/TR-H/*", family: [L1, L2, L3, L4a, L5, L6, L7, L8], qualified_from: "{out}/TR-H/stats.json", window: branch, members: [0, 1, 2, 3], bench: "{bench:TR-H:trunk}", cap: 1.0, run_metric: delta_price, lever: L2, stat: p_holm}
    source: {file: "{out}/TR-H/stats.json", path: "h1r.levers.L2.p_holm"}
    tolerance: 0.001
  C3b_n_rejected_trunk_scoring:
    claim: C3b
    metric: holm_family
    runs: "{camp}/TR-H/*"
    params: {arm: sham, treatment_runs: "{camp}/TR-H/*", family: [L1, L2, L3, L4a, L5, L6, L7, L8], qualified_from: "{out}/TR-H/stats.json", window: branch, members: [0, 1, 2, 3], bench: "{bench:TR-H:trunk}", cap: 1.0, run_metric: delta_price, stat: n_rejected}
    source: {file: "{out}/TR-H/stats.json", path: "h1r.n_rejected_trunk"}
    tolerance: 0.0
  C3b_holm_p_L1:
