    params: {arm: sham, treatment_runs: "{camp}/TR-H/*", family: [L1, L2, L3, L4a, L5, L6, L7, L8], qualified_from: "{out}/TR-H/stats.json", window: branch, members: [0, 1, 2, 3], bench: "{bench:TR-H:trunk}", cap: 1.0, run_metric: delta_price, lever: L6, stat: p_holm}
