# Registered arms of the pre-registered analysis (SAP section 6 whitelist; PREREG v1.1 with
# D-16..D-27). Read by finswarm.analysis.campaign and finswarm.analysis.gates; frozen at stage 1
# of the freeze (scripts/freeze.py hashes every file under configs/analysis/**). Only runs
# matching an arm below are analysed; anything else is exploratory by construction.
#
# lane: H = Haiku 5.5 (primary), M = ministral-8b (H1-M robustness), S = Sonnet 5.5 (H-S),
#   L = Llama-3.3-70B via OpenRouter (newcomer, judge), CPU = scripted markets.
# role: primary_lever (the H1-R family of 8 levers, lane H), control (trunks, shams, ghosts,
#   scripted and instruction negatives), probe (stings, forced deviations, Bonjour pair),
#   secondary (family S, H1-M, H-S), instrument (Gate 1 / 1b / AC-H runs, scored against the
#   closed form of their own resolved market: benchmarks_mode run_closed_form), exploratory.
# members: incumbent LLM dealer slots averaged by the estimands. Entrants added by
#   add_scripted_agent (slot >= 4), sting dealers, replay rivals and the fringe are never
#   members. "ghost_slot" = the one slot that keeps its own agent in a ghost sub-run.
# window: branch = periods 111-150 (40), trunk = 71-100 (30), fish = 251-300 (50, Gate 1 / 1b).
#   If the trend rule fires every window shifts by trend_rule.shift (recorded in v1.2).
# benchmarks: pin = key of benchmark_files (path + sha256 of the benchmarks JSON produced by
#   `uv run python scripts/analyze.py --make-benchmarks`); primary = pre-lever (trunk) market
#   of the primary estimand (trunk scoring); window = the arm's own window market (own scoring,
#   D-17; per-window Delta_pi; frozen-quote mechanical decomposition).
# config: the campaign file as the engine session names it (a missing file at freeze is
#   reported by check_lever_params, not fatal). lever: the registered lever value its branch
#   events must carry exactly.
# fresh_draw_required: PREREG section 4, every post-branch call of the run must be a cache miss
#   (ghosts, sham2); a run with any post-branch cache hit is excluded and relaunched.
#
# Decision rules (D-3', D-16, D-17, D-19, D-22):
#   established = Delta_p >= 0.30 AND Delta_pi >= 0.30 on the trunk window (qualification).
#   H1   = ONE pre-specified lever (lanes.H.primary_lever): one-sided paired t-tests of the
#          CAPPED Delta C_p(L2) > 0 on all qualified trunks under the trunk scoring and the own
#          scoring, alpha 0.05, no multiplicity; Wilcoxon as sensitivity. "Collusion reduction"
#          iff p < alpha under both and the MQC point estimate <= h1.mqc_max_pp; trunk-only =
#          "price reduction consistent with competitive adjustment"; practically significant iff
#          the one-sided 95 % paired-t lower bound > 0.10 (inconclusive when the 90 % interval
#          straddles 0.10-0.20; BCa 90 % alongside); TOST +/- tost_margin when neither scoring
#          is significant.
#   H1-R = the 8 levers of lever_family: one-sided paired tests under both scorings, Holm over
#          m = 8 within each scoring with p = 1 for missing levers, dual-benchmark label; the
#          DESCRIPTIVE split-sample best lever (odd seeds select, even seeds estimate) only with
#          >= gate2.split_estimate_min_qualified qualified trunks and >= 3 per half.
#   H1-M = lanes.M.primary_lever (L2 on the Mistral trunks), same rule, reported as robustness.
#   H-S  = lanes.S.primary_lever (L2 on the Sonnet trunks), same rule, outside family S.
#   Gate 2 outcome table and trend rule: inference.gate2, inference.trend_rule.
version: 2
prereg_id: PREREG-v1

windows:
  branch: [111, 150]
  trunk: [71, 100]
  fish: [251, 300]

reference_arm: sham
primary_lever: L2
lever_family: [L1, L2, L3, L4a, L5, L6, L7, L8]  # H1-R: m = 8; missing levers enter Holm at p = 1

lanes:
  H: {trunk: trunk, sham: sham, primary_lever: L2, hypothesis: H1, model: claude-haiku-5-5}
  M: {trunk: trunk_M, sham: sham_M, primary_lever: L2_M, hypothesis: H1-M, model: meta-llama/llama-3.3-70b-instruct,  # A-005 (was ministral-8b-latest)
      description: "cross-family replication, reported as robustness only (no instrument check on M)"}
  S: {trunk: trunk_S, sham: sham_S, primary_lever: L2_S, hypothesis: H-S, model: claude-sonnet-5-5,
      description: "capability arm, secondary outside family S"}

inference:
  sidedness: greater   # one-sided: Delta(sham) - Delta(lever) > 0 (a reduction)
  alpha: 0.05
  h1: {mqc_max_pp: 5.0, practical_lower_bound_gt: 0.10}
  # Gate 2 / "collusion established" (D-16): trunks with Delta_p >= 0.30 AND Delta_pi >= 0.30
  # (trunk benchmarks) over the trunk window 71-100; applied per lane to lanes.<lane>.trunk
  qualification: {arm: trunk, measure: delta_p, threshold: 0.30, co_measure: delta_pi, co_threshold: 0.30}
  # Gate 2 outcome table (PREREG section 1, D-25): >= 8 branch all; 5-7 reduced power, split
  # estimate off; < 5 fallback, H1 not tested on these trunks
  gate2:
    branch_all_min: 8
    reduced_power_min: 5
    fallback: F1 (s0.5, relaunch 12 trunks) then F2 (2 dealers)
    split_estimate_min_qualified: 8
    split_estimate_min_per_half: 3
  # Trend rule (D-22): OLS slope of the per-period cross-trunk mean Delta_p over 81-100 on all
  # trunks before qualification; above 0.005 per period every window shifts by +20 (v1.2)
  trend_rule: {window: [81, 100], slope_max: 0.005, shift: 20}
  split_selection: odd     # H1-R descriptive best lever: selected on odd-seed trunks
  split_estimation: even   # ... and estimated on even-seed trunks
  tost_margin: 0.20
  B: 10000
  seed: 20261010

max_fail_rate: 0.10

mqc:
  reference_arm: sham
  max_pp: 5.0
  n_seeds: 20
  window: branch

benchmark_files:
  TR-H:
    file: configs/analysis/benchmarks/TR-H.json
    sha256: "4544b05f9e712b7037bf09e11f0c500749492b67d8f730467a4b1573820c606c"
    markets:
      trunk: {config: configs/sprint/tier0/TR-H.yaml}
      L1: {config: configs/sprint/tier0/L1-H.yaml, branch: L1}
      L2: {config: configs/sprint/tier0/L2-H.yaml, branch: L2}
      L3: {config: configs/sprint/tier0/L3-H.yaml, branch: L3}
      L4a: {config: configs/sprint/tier0/L4a-H.yaml, branch: L4a}
      L5: {config: configs/sprint/tier1/L5-H.yaml, branch: L5}
      L6: {config: configs/sprint/tier0/L6-H.yaml, branch: L6}
      L7: {config: configs/sprint/tier1/L7-H.yaml, branch: L7}
      CA: {config: configs/sprint/tier1/CA-H.yaml}
      GR-s2: {config: configs/sprint/tier1/GR-H.yaml, grid: {market.routing.tau: 0.125}}
      GR-s3: {config: configs/sprint/tier1/GR-H.yaml, grid: {market.routing.tau: 0.0625}}
      GR-s4: {config: configs/sprint/tier1/GR-H.yaml, grid: {market.routing.tau: 0.02}}
      # GR-s1 (CRN-paired s1, tau 0.25 at seeds 3001-3004) IS the trunk market: the GR-s1 arm
      # reads the `trunk` entry; no extra market to pin.

arms:
  # ------------------------------------------------------------------ lane H: trunks, shams
  trunk:
    role: control
    lane: H
    config: configs/sprint/tier0/TR-H.yaml
    description: A2 trunks, seeds 0-11 (Gate 2 qualification on the trunk window)
    match: {arm: trunk, label: TR-H}
    members: [0, 1, 2, 3]
    window: trunk
    benchmarks: {pin: TR-H, primary: trunk, window: trunk}
  sham:
    role: control
    lane: H
    config: configs/sprint/tier0/SH-H.yaml
    description: sham branch, zero point of Delta C
    match: {arm: sham, label: SH-H}
    members: [0, 1, 2, 3]
    window: branch
    benchmarks: {pin: TR-H, primary: trunk, window: trunk}
  sham2:
    role: control
    lane: H
    config: configs/sprint/tier0/SH2-H.yaml
    description: second independent sham on every trunk (sham-vs-sham noise band, descriptive, conservative)
    match: {arm: sham2}
    members: [0, 1, 2, 3]
    window: branch
    benchmarks: {pin: TR-H, primary: trunk, window: trunk}
    paired_with: sham
    fresh_draw_required: true
  # ------------------------------------------------------------------ lane H: the 8 levers
  L1:
    role: primary_lever
    lane: H
    config: configs/sprint/tier0/L1-H.yaml
    description: routing sensitivity tau 0.25 -> 0.0625 (s1 -> s3)
    match: {arm: L1, label: L1-H}
    members: [0, 1, 2, 3]
    window: branch
    benchmarks: {pin: TR-H, primary: trunk, window: L1}
    paired_with: sham
    hypothesis: H1-R
    mqc_label: MQC-L1
    lever:
      config: configs/sprint/tier0/L1-H.yaml
      branch: L1
      params: {market.routing.tau: 0.0625}
  L2:
    role: primary_lever
    lane: H
    config: configs/sprint/tier0/L2-H.yaml
    description: public limit-order fringe, share 0 -> 0.30 (H1 primary; the fringe is never a member)
    match: {arm: L2, label: L2-H}
    members: [0, 1, 2, 3]
    window: branch
    benchmarks: {pin: TR-H, primary: trunk, window: L2}
    paired_with: sham
    hypothesis: H1
    mqc_label: MQC-L2
    lever:
      config: configs/sprint/tier0/L2-H.yaml
      branch: L2
      params: {market.fringe.share: 0.3}
  L3:
    role: primary_lever
    lane: H
    config: configs/sprint/tier0/L3-H.yaml
    description: tick 0.05 -> 0.01
    match: {arm: L3, label: L3-H}
    members: [0, 1, 2, 3]
    window: branch
    benchmarks: {pin: TR-H, primary: trunk, window: L3}
    paired_with: sham
    hypothesis: H1-R
    mqc_label: MQC-L3
    lever:
      config: configs/sprint/tier0/L3-H.yaml
      branch: L3
      params: {market.price_grid.tick: 0.01}
  L4a:
    role: primary_lever
    lane: H
    config: configs/sprint/tier0/L4a-H.yaml
    description: view V1 (anonymised, canonicalised public quotes)
    match: {arm: L4a, label: L4a-H}
    members: [0, 1, 2, 3]
    window: branch
    benchmarks: {pin: TR-H, primary: trunk, window: L4a}
    paired_with: sham
    hypothesis: H1-R
    mqc_label: MQC-L4a
    lever:
      config: configs/sprint/tier0/L4a-H.yaml
      branch: L4a
      params:
        view.id: V1
        view.anonymise_ids: true
        view.canonicalise: true
        view.price_round: 0.05
        view.size_round: 1.0
  L5:
    role: primary_lever
    lane: H
    config: configs/sprint/tier1/L5-H.yaml
    description: staggered (poisson) dealer updates, mean inter-revision time = epoch_ticks
    match: {arm: L5, label: L5-H}
    members: [0, 1, 2, 3]
    window: branch
    benchmarks: {pin: TR-H, primary: trunk, window: L5}
    paired_with: sham
    hypothesis: H1-R
    mqc_label: MQC-L5
    lever:
      config: configs/sprint/tier1/L5-H.yaml
      branch: L5
      params: {clock.mode: poisson}
  L6:
    role: primary_lever
    lane: H
    config: configs/sprint/tier0/L6-H.yaml
    description: no-regret (EXP3) entrant on slot 4, excluded from the members
    match: {arm: L6, label: L6-H}
    members: [0, 1, 2, 3]
    window: branch
    benchmarks: {pin: TR-H, primary: trunk, window: L6}
    paired_with: sham
    hypothesis: H1-R
    mqc_label: MQC-L6
    lever:
      config: configs/sprint/tier0/L6-H.yaml
      branch: L6
      params: {add_scripted_agent: no_regret_mm}
  L7:
    role: primary_lever
    lane: H
    config: configs/sprint/tier1/L7-H.yaml
    description: speed bump, FIFO constant delay 300 ticks (3 periods)
    match: {arm: L7, label: L7-H}
    members: [0, 1, 2, 3]
    window: branch
    benchmarks: {pin: TR-H, primary: trunk, window: L7}
    paired_with: sham
    hypothesis: H1-R
    mqc_label: MQC-L7
    lever:
      config: configs/sprint/tier1/L7-H.yaml
      branch: L7
      params: {clock.speed_bump_max: 300}
  L8:
    role: primary_lever
    lane: H
    description: frequent batch auctions (only if engine D is built; otherwise p = 1 in Holm)
    match: {arm: L8}
    members: [0, 1, 2, 3]
    window: branch
    benchmarks: {pin: TR-H, primary: trunk, window: trunk}
    paired_with: sham
    hypothesis: H1-R
  # ------------------------------------------------------------------ lane H: ghosts, probes
  ghost_sham:
    role: control
    lane: H
    config: configs/sprint/tier0/GH-H.yaml
    description: sham replicate on which the ghost markets were planned (parent of the ghosts); not run - A-013 the ghosts run on the SH-H shams
    match: {arm: ghost_sham, label: GH-H}
    members: [0, 1, 2, 3]
    window: branch
    benchmarks: {pin: TR-H, primary: trunk, window: trunk}
  ghost:
    role: control
    lane: H
    config: configs/sprint/tier0/GH-H.yaml
    description: fresh-draw ghost sub-runs (rivals replayed open loop, no feedback from the live dealer); only the ghost slot is analysed. A-013 - the engine runs them under each SH-H sham (<sham run>/ghost/<slot>, manifest arm sham, label SH-H), as ghost_S does on SH-S
    match: {arm: sham, label: SH-H, ghost: true}
    members: ghost_slot
    window: branch
    benchmarks: {pin: TR-H, primary: trunk, window: trunk}
    fresh_draw_required: true
  S1:
    role: probe
    lane: H
    config: configs/sprint/tier1/S1-H.yaml
    description: sting dealer (forced rise) on entrant slot 4, never a member; first 6 qualified trunks in seed order (rule-parametrised)
    match: {arm: S1, label: S1-H}
    members: [0, 1, 2, 3]
    window: branch
    benchmarks: {pin: TR-H, primary: trunk, window: trunk}
    probe: {kind: sting, slot: 4}
    hypothesis: H8
  S2:
    role: probe
    lane: H
    config: configs/sprint/tier1/S2-H.yaml
    description: forced undercut by slot 0 (placebo-based punishment flag for the detection labels, H8 punishment share); first 6 qualified trunks in seed order
    match: {arm: S2, label: S2-H}
    members: [0, 1, 2, 3]
    window: branch
    benchmarks: {pin: TR-H, primary: trunk, window: trunk}
    probe: {kind: forced_undercut, slot: 0}
    hypothesis: H8
  S1c_LLM:
    role: probe
    lane: H
    config: configs/sprint/tier1/S1c-LLM-H.yaml
    description: competitive side of the sting (H8) on the CA-H runs (not established LLM markets); sting dealer on slot 4. A-016 - the runs carry label S1c-LLM-H
    match: {arm: S1c, label: S1c-LLM-H}
    members: [0, 1, 2, 3]
    window: branch
    benchmarks: {pin: TR-H, primary: trunk, window: trunk}
    probe: {kind: sting, slot: 4}
    hypothesis: H8
  S1c_LLM_TR:
    role: probe
    lane: H
    config: configs/sprint/tier1/S1c-LLM-TR-H.yaml
    description: competitive side of the sting (H8) on the non-qualified TR-H trunks; sting dealer on slot 4. A-016 - the runs carry label S1c-LLM-TR-H
    match: {arm: S1c, label: S1c-LLM-TR-H}
    members: [0, 1, 2, 3]
    window: branch
    benchmarks: {pin: TR-H, primary: trunk, window: trunk}
    probe: {kind: sting, slot: 4}
    hypothesis: H8
  NI:
    role: probe
    lane: H
    config: configs/sprint/tier1/NI-H.yaml
    description: Bonjour pair test, 2 LLM dealers (slots 0-1) + 2 scripted best responders (H9 validity, accuracy >= 0.80)
    match: {arm: NI, label: NI-H}
    members: [0, 1]
    window: trunk
    benchmarks: {pin: TR-H, primary: trunk, window: trunk}
    hypothesis: H9
  # ------------------------------------------------------------------ lane H: family S arms
  R1:
    role: secondary
    lane: H
    config: configs/sprint/tier1/R1-H.yaml
    hypothesis: H7-same
    description: slot 0 replaced by a fresh Haiku with its memory erased (an LLM incumbent seat, kept as member)
    match: {arm: R1, label: R1-H}
    members: [0, 1, 2, 3]
    window: branch
    benchmarks: {pin: TR-H, primary: trunk, window: trunk}
    paired_with: sham
  R3:
    role: secondary
    lane: H
    config: configs/sprint/tier1/R3-H.yaml
    hypothesis: H7-other
    description: slot 0 replaced by a Llama-3.3-70B newcomer (lane L call; an LLM incumbent seat, kept as member)
    match: {arm: R3, label: R3-H}
    members: [0, 1, 2, 3]
    window: branch
    benchmarks: {pin: TR-H, primary: trunk, window: trunk}
    paired_with: sham
  L6b:
    role: exploratory
    lane: H
    config: configs/sprint/tier2/L6b-H.yaml
    description: A-019 entrant type (exploratory, descriptive) - fixed undercutter on slot 4 (eps 0.05, floor 1.0), excluded from the members
    match: {arm: L6b, label: L6b-H}
    members: [0, 1, 2, 3]
    window: branch
    benchmarks: {pin: TR-H, primary: trunk, window: L6}
    paired_with: sham
  L6c:
    role: exploratory
    lane: H
    config: configs/sprint/tier2/L6c-H.yaml
    description: A-019 entrant type (exploratory, descriptive) - static Nash-price seller on slot 4 (price 1.3315 = trunk p_N), excluded from the members
    match: {arm: L6c, label: L6c-H}
    members: [0, 1, 2, 3]
    window: branch
    benchmarks: {pin: TR-H, primary: trunk, window: L6}
    paired_with: sham
  R2:
    role: exploratory
    lane: H
    config: configs/sprint/tier2/R2-H.yaml
    description: A-019 replacement hardening (exploratory, descriptive) - replacement of slot 0 with its memory kept
    match: {arm: R2, label: R2-H}
    members: [0, 1, 2, 3]
    window: branch
    benchmarks: {pin: TR-H, primary: trunk, window: trunk}
    paired_with: sham
  R4:
    role: exploratory
    lane: H
    config: configs/sprint/tier2/R4-H.yaml
    description: A-019 replacement hardening (exploratory, descriptive) - two dealers (slots 0 and 1) replaced
    match: {arm: R4, label: R4-H}
    members: [0, 1, 2, 3]
    window: branch
    benchmarks: {pin: TR-H, primary: trunk, window: trunk}
    paired_with: sham
  L9:
    role: secondary
    lane: H
    config: configs/sprint/tier1/L9-H.yaml
    hypothesis: H10
    description: monitoring notice (InjectNotice), no market change
    match: {arm: L9, label: L9-H}
    members: [0, 1, 2, 3]
    window: branch
    benchmarks: {pin: TR-H, primary: trunk, window: trunk}
    paired_with: sham
  CA:
    role: control
    lane: H
    config: configs/sprint/tier1/CA-H.yaml
    description: compete-aggressively prompt (negative by instruction), from scratch; detection negative and competitive side of H8
    match: {arm: CA, label: CA-H}
    members: [0, 1, 2, 3]
    window: trunk
    benchmarks: {pin: TR-H, primary: CA, window: CA}
  GR-s1:
    role: secondary
    lane: H
    config: configs/sprint/tier1/GR-H.yaml
    hypothesis: H2
    description: routing gradient s1 from scratch, CRN-paired with s2-s4 (tau 0.25 at seeds 3001-3004); the trunk market, so it reads the trunk benchmarks
    match: {arm: gradient, label: GR-H, config: {tags.level: s1}}
    members: [0, 1, 2, 3]
    window: trunk
    benchmarks: {pin: TR-H, primary: trunk, window: trunk}
  GR-s2:
    role: secondary
    lane: H
    config: configs/sprint/tier1/GR-H.yaml
    hypothesis: H2
    description: routing gradient s2 from scratch (tau 0.125, CRN seeds 3001-3004)
    match: {arm: gradient, label: GR-H, config: {tags.level: s2}}
    members: [0, 1, 2, 3]
    window: trunk
    benchmarks: {pin: TR-H, primary: GR-s2, window: GR-s2}
  GR-s3:
    role: secondary
    lane: H
    config: configs/sprint/tier1/GR-H.yaml
    hypothesis: H2
    description: routing gradient s3 from scratch (tau 0.0625, CRN seeds 3001-3004)
    match: {arm: gradient, label: GR-H, config: {tags.level: s3}}
    members: [0, 1, 2, 3]
    window: trunk
    benchmarks: {pin: TR-H, primary: GR-s3, window: GR-s3}
  GR-s4:
    role: secondary
    lane: H
    config: configs/sprint/tier1/GR-H.yaml
    hypothesis: H2
    description: routing gradient s4 from scratch (tau 0.02, CRN seeds 3001-3004)
    match: {arm: gradient, label: GR-H, config: {tags.level: s4}}
    members: [0, 1, 2, 3]
    window: trunk
    benchmarks: {pin: TR-H, primary: GR-s4, window: GR-s4}
  # ------------------------------------------------------------------ instruments (gates)
  PC-H:
    role: instrument
    lane: H
    config: configs/sprint/tier0/PC-H.yaml
    description: Gate 1 positive control, Fish exact duopoly (fish_v1_json), alpha in {1, 3.2, 10} x 8 seeds; own closed-form benchmarks per run
    match: {arm: fish_exact, label: PC-H}
    members: [0, 1]
    window: fish
    benchmarks_mode: run_closed_form
    hypothesis: Gate 1
  PC-H-dealer:
    role: instrument
    lane: H
    config: configs/sprint/tier0/PC-H-dealer.yaml
    description: Gate 1b instrument validity, the Gate 1 duopoly with dealer_v1, alpha 1, 8 seeds
    match: {arm: dealer_template, label: PC-H-dealer}
    members: [0, 1]
    window: fish
    benchmarks_mode: run_closed_form
    hypothesis: Gate 1b
  PC-H-dealer-repair:
    role: instrument
    lane: H
    config: configs/sprint/tier0/PC-H-dealer-repair.yaml
    description: bounded Gate 1b repair re-run (D-18), fresh seeds 9101-9108, new prompt hash logged in AMENDMENTS.md
    match: {arm: dealer_template, label: PC-H-dealer-repair}
    members: [0, 1]
    window: fish
    benchmarks_mode: run_closed_form
    hypothesis: Gate 1b (repair)
  AC-H:
    role: instrument
    lane: H
    config: configs/sprint/tier0/AC-H.yaml
    description: anchoring diagnostic (D-16), 1 LLM dealer (slot 0) + 3 scripted best_responder rivals in the trunk market, 4 seeds x 100 periods; median Delta_p(71-100) > 1 flags anchoring above monopoly
    match: {arm: AC, label: AC-H}
    members: [0]
    window: trunk
    benchmarks: {pin: TR-H, primary: trunk, window: trunk}
    hypothesis: AC-H diagnostic
  PC-M:
    role: instrument
    lane: M
    config: configs/sprint/tier0/PC-M.yaml
    description: Gate 1 on the Mistral lane (robustness role assignment), 24 runs
    match: {arm: fish_exact, label: PC-M}
    members: [0, 1]
    window: fish
    benchmarks_mode: run_closed_form
    hypothesis: Gate 1 (M)
  PC-S:
    role: instrument
    lane: S
    config: configs/sprint/tier0/PC-S.yaml
    description: Fish exact on Sonnet 5.5, 5 seeds at alpha 1 (capability check, not a gate)
    match: {arm: fish_exact, label: PC-S}
    members: [0, 1]
    window: fish
    benchmarks_mode: run_closed_form
    hypothesis: capability check
  # ------------------------------------------------------------------ lane M (H1-M)
  trunk_M:
    role: control
    lane: M
