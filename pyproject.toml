[project]
name = "finswarm"
version = "0.1.0"
description = "Hybrid market testbed: tacit collusion among LLM dealer agents across market structures, with a plus-factor audit"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Clément Barbier" }]
dependencies = [
  "numpy>=2.0",
  "numba>=0.60",
  "polars>=1.0",
  "pyarrow>=16",
  "pydantic>=2.7",
  "pyyaml>=6",
  "typer>=0.12",
  "anthropic>=0.40",
  "mistralai>=1.0",
  "httpx>=0.27",
  "tenacity>=8.2",
  "python-dotenv>=1.0",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "networkx>=3.3",
  "matplotlib>=3.9",
  "rich>=13",
]

[project.optional-dependencies]
providers = ["openai>=1.40", "google-genai>=1.0"]

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2.3", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
finswarm = "finswarm.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finswarm"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks", "results", ".claude/worktrees"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow and not llm'"
markers = [
  "slow: long-running (benchmarks, large campaigns)",
  "llm: requires live API access",
  "smoke: end-to-end with the mock provider",
]
timeout = 120

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
